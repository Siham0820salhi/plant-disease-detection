# =============================================================================
# CI - API Deployment (P7)
# =============================================================================
# Workflow CI dédié à l'API FastAPI (dossier src/api/).
# Déclenché UNIQUEMENT quand des fichiers dans src/api/ sont modifiés.
# Ne perturbe pas le travail des autres membres (pipeline, notebook, tests/).
#
# Étapes :
#   1. Checkout du code
#   2. Setup Python 3.11 + cache pip
#   3. Installation des dépendances légères (src/api/requirements.txt + outils CI)
#   4. Lint avec ruff
#   5. Tests avec pytest
#   6. Build de l'image Docker (sans push)
# =============================================================================

name: "CI - API Deployment (P7)"

on:
  push:
    paths:
      - "src/api/**"
  pull_request:
    paths:
      - "src/api/**"

jobs:
  ci-api:
    name: "Lint → Tests → Build Docker"
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Récupération du code source
      # -----------------------------------------------------------------------
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Installation de Python 3.11 avec cache pip
      # -----------------------------------------------------------------------
      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "src/api/requirements.txt"

      # -----------------------------------------------------------------------
      # 3. Installation des dépendances
      # -----------------------------------------------------------------------
      # On installe UNIQUEMENT src/api/requirements.txt (léger : fastapi, uvicorn,
      # pillow…) — pas le requirements.txt racine (tensorflow, opencv, pandas…).
      # ruff et pytest sont ajoutés pour la CI, ils ne sont pas dans les deps
      # de production de l'API.
      - name: "📦 Installation des dépendances"
        run: |
          python -m pip install --upgrade pip
          pip install -r src/api/requirements.txt
          pip install ruff pytest httpx

      # -----------------------------------------------------------------------
      # 4. Lint du code avec ruff
      # -----------------------------------------------------------------------
      # Vérifie la qualité du code dans src/api/, en excluant le dossier de tests
      # (les tests ont des conventions de style plus souples).
      - name: "🔍 Lint du code (ruff)"
        run: ruff check src/api/ --exclude src/api/tests

      # -----------------------------------------------------------------------
      # 5. Exécution des tests unitaires
      # -----------------------------------------------------------------------
      # Lance les tests pytest situés dans src/api/tests/ (test_health.py,
      # test_predict.py). Le flag -v affiche le détail de chaque test.
      - name: "🧪 Tests unitaires (pytest)"
        run: pytest src/api/tests/ -v

      # -----------------------------------------------------------------------
      # 6. Build de l'image Docker
      # -----------------------------------------------------------------------
      # Construit l'image Docker sans la pousser vers un registry.
      # Objectif : vérifier que le Dockerfile est valide et que le build
      # ne casse pas (dépendances manquantes, erreurs de COPY, etc.).
      #
      # -f src/api/Dockerfile  → chemin vers le Dockerfile
      # -t plant-api:ci        → tag temporaire pour la CI
      # ./src/api               → contexte de build (cohérent avec le dev local)
      - name: "🐳 Build de l'image Docker"
        run: docker build -f src/api/Dockerfile -t plant-api:ci ./src/api